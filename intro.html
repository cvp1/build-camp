<style>
@font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0}
html,body{height:100%}

</style>
</head>
<body>
<div class="app">
  <div class="mark">BUILD CAMP</div>
  <div class="vid"><video src="intro.mp4" poster="intro-poster.jpg" autoplay muted loop playsinline controls></video></div>
